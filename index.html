<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiceScript — Dice Probability Engine</title>
<meta name="description" content="DiceScript: write a tabletop dice roll once and get a sampled result or the full probability distribution — exploding dice, advantage, keep/drop, success pools, and live charts.">
<meta name="theme-color" content="#0e0e10">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="canonical" href="https://pozz94.github.io/DiceProbabilityEngine/">
<meta property="og:type" content="website">
<meta property="og:title" content="DiceScript — Dice Probability Engine">
<meta property="og:description" content="Write a tabletop dice roll once; get a sampled result or the full probability distribution. Exploding dice, advantage, success pools, live charts.">
<meta property="og:url" content="https://pozz94.github.io/DiceProbabilityEngine/">
<meta property="og:image" content="https://pozz94.github.io/DiceProbabilityEngine/icon.svg">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="style.css">
<script type="module" src="src/editor.js"></script>
</head>
<body>

<header id="topbar">
  <h1 class="title"><span aria-hidden="true">⚄</span><span class="title-text"> Dice Engine</span></h1>
  <div class="tag">DiceScript</div>
  <div class="spacer"></div>
  <div class="shortcut">Ctrl+Enter</div>
  <a class="example" id="docs-btn" href="docs.html">DOCS</a>
  <!-- disabled until editor.js wires them up (it loads Monaco first) -->
  <button type="button" class="example" id="examples-btn" disabled
          aria-expanded="false" aria-controls="menu-accordion">EXAMPLES ▾</button>
  <button type="button" class="example" id="projects-btn" disabled
          aria-expanded="false" aria-controls="menu-accordion">PROJECTS ▾</button>
  <button type="button" class="run" id="run-btn" disabled>▶ RUN</button>
</header>

<div id="menu-accordion">
  <div id="menu-inner"></div>
</div>

<main id="main">
  <section id="editor-pane" aria-label="Editor">
    <div id="monaco-container"></div>
  </section>
  <section id="output-pane" aria-label="Output">
    <h2 class="pane-header">OUTPUT</h2>
    <!-- charts carry no text of their own, so a run is announced as a summary -->
    <p id="run-status" class="sr-only" role="status" aria-live="polite"></p>
    <div id="controls-bar" style="display:none"></div>
    <div id="output-scroll">
      <div class="empty-state">
        <div class="big" aria-hidden="true">⚄</div>
        <div>Write expressions · press Run</div>
      </div>
    </div>
  </section>
</main>

</body>
</html>
